<ui id="simple-rts-root" class="app-root simple-rts-shell">
	<div id="simple-rts-shell" class="column fg1 minh0">
		@if (state.setupVisible) {
		<div id="simple-rts-setup-shell" class="app-shell panel g10 p20 setup-fill">
			<div class="row g10 align-center">
				<image class="header-icon icon-muted" icon="adjustments" />
				<label class="fg1">Simple RTS — World Setup</label>
				<button class="theme-toggle p10" label="Toggle light and dark theme"
					[text]="ui.themeToggleLabel" (activate)="SimpleRts.ToggleTheme" />
			</div>

			<label class="entry-description" [text]="state.subtitle" />

			<div id="simple-rts-setup-scroll" class="app-scroll section g10 fg1 min-h-0">
				<div class="section g10">
					<label class="field-label">SAVED PRESETS</label>
					<div class="labeled-row row g10">
						<label class="field-label">Preset</label>
						<select class="fg1" label="Saved preset" [value]="state.selectedPreset"
							[options]="presets.list" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Save as</label>
						<input class="fg1" placeholder="my-test-world" label="Preset name"
							[value]="state.presetName" />
					</div>
					<div class="row g10 wrap">
						<button class="p10 fg1" text="Load preset" (activate)="SimpleRts.LoadPreset" />
						<button class="p10 fg1" text="Save preset" (activate)="SimpleRts.SavePreset" />
						<button class="p10 fg1" text="Delete saved" (activate)="SimpleRts.DeletePreset" />
					</div>
				</div>

				<div class="section g10">
					<label class="field-label">WORLD</label>
					<div class="labeled-row row g10">
						<label class="field-label">Map size (m)</label>
						<number-input class="fg1" min="250" max="4000" step="50" label="Map size in meters"
							[value]="state.mapSize" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Terrain points</label>
						<number-input class="fg1" min="1000" max="250000" step="1000" label="Terrain mesh points"
							[value]="state.terrainPointCount" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Water</label>
						<checkbox class="fg1" text="Low areas become lakes and block spawns"
							label="Enable water" [value]="state.enableWater" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Elevation</label>
						<checkbox class="fg1" text="Procedural height variation from simplex noise"
							label="Enable elevation" [value]="state.enableElevation" />
					</div>
				</div>

				<div class="section g10">
					<label class="field-label">ENTITIES</label>
					<div class="labeled-row row g10">
						<label class="field-label">Humans</label>
						<number-input class="fg1" min="0" max="15000" step="25" label="Human count"
							[value]="state.humans" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Rabbits</label>
						<number-input class="fg1" min="0" max="15000" step="25" label="Rabbit count"
							[value]="state.rabbits" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Wolves</label>
						<number-input class="fg1" min="0" max="15000" step="25" label="Wolf count"
							[value]="state.wolves" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Trees</label>
						<number-input class="fg1" min="0" max="2000" step="1" label="Tree count"
							[value]="state.trees" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Bushes</label>
						<number-input class="fg1" min="0" max="15000" step="25" label="Bush count"
							[value]="state.bushes" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Berry bushes</label>
						<number-input class="fg1" min="0" max="15000" step="25" label="Berry bush count"
							[value]="state.berryBushes" />
					</div>
					<div class="labeled-row row g10">
						<label class="field-label">Bodies</label>
						<number-input class="fg1" min="0" max="5000" step="10" label="Body count"
							[value]="state.bodies" />
					</div>
				</div>
			</div>

			<label class="status-text" [text]="state.statusLine" />

			<div class="row g10">
				<button class="p10 fg1" text="Reset draft" (activate)="SimpleRts.ResetDraft" />
				<button class="p10 fg1" text="Start / rebuild world" (activate)="SimpleRts.ApplyWorld" />
				@if (state.worldRunning) {
				<button class="p10 fg1" text="Close setup" (activate)="SimpleRts.CloseSetup" />
				}
			</div>
		</div>
		}
		@if (!state.setupVisible) {
		<rts-world id="rts-world" class="fg1 dock-panel minh0"></rts-world>
		}
	</div>
</ui>
