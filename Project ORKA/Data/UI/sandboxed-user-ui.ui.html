<ui class="user-card">
	<label class="title" [text]="userUi.title"/>
	@if (userUi.visible) {
		<div class="content">
			<label class="message" [text]="userUi.message"/>
			<div class="meter-row">
				<label>Score</label>
				<progress [value]="userUi.score"/>
			</div>
			<div class="tags">
				@for (tag of userUi.tags; track tag.id) {
					<label class="tag" [text]="tag.label"/>
				}
			</div>
		</div>
	}
	@if (!userUi.visible) {
		<label class="fallback">Content unavailable</label>
	}
</ui>
