<ui id="game-loader" class="app-root game-loader p20">
	<div id="game-loader-shell" class="app-shell g10">
		<div class="row g10 align-center">
			<image class="header-icon icon-muted" icon="apps" />
			<label id="type-kicker" class="fg1">PROJECT ORKA</label>
			<button id="game-loader-theme-toggle" class="theme-toggle p10" label="Toggle light and dark theme"
				[text]="ui.themeToggleLabel" (activate)="Launcher.ToggleTheme" />
		</div>

		<label id="type-title" class="typography-sample">Game Launcher</label>
		<label>Choose an experiment, prototype, or tool to launch.</label>

		<div class="row g10 align-center">
			<label class="fg1">AVAILABLE PROJECTS</label>
			<div id="game-loader-count-pill" class="app-badge p10">
				<label id="game-loader-count" class="text-badge" [text]="ui.projectCount" />
			</div>
		</div>

		<div id="game-list-panel" class="panel">
			<div id="game-list" class="row wrap g10">
				@for (game of launcher.games; track game.id) {
				<button class="launcher-entry b250 row p10 g10 align-center mw0 fg1" [id]="game.id"
					[label]="game.name">
					<div class="g5 fg1 mw0">
						<label [text]="game.name" />
						<label class="entry-description" [text]="game.description" />
					</div>
				</button>
				}
			</div>
		</div>

		<div class="row g10 align-center">
			<image class="header-icon icon-muted" icon="player-play" />
			<label class="entry-description fg1">Click a tile to launch · Scroll for more</label>
		</div>
	</div>
</ui>
