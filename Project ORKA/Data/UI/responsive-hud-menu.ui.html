<ui class="hud-shell">
	<div class="hud-top">
		<label class="hud-title" [text]="game.title"/>
		<div class="hud-vitals">
			<label class="vital" [text]="player.health"/>
			<label class="vital" [text]="player.armor"/>
		</div>
		<button class="icon-button" (activate)="Hud.ToggleMenu">Pause</button>
	</div>
	<div class="objective-stack">
		@for (objective of hud.objectives; track objective.id) {
			<div class="objective">
				<label [text]="objective.title"/>
				<progress [value]="objective.progress"/>
			</div>
		}
	</div>
	@if (hud.menuOpen) {
		<div class="pause-menu">
			<label class="menu-heading">Paused</label>
			<button class="menu-action" (activate)="Hud.Resume">Resume</button>
			<button class="menu-action" (activate)="Hud.OpenSettings">Settings</button>
			<button class="menu-action danger" (activate)="Hud.Quit">Quit</button>
		</div>
	}
</ui>
